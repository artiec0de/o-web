<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Orik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one full-bleed landscape canvas; HUD strip on top, menus as offset-shadow cards, thumb pads in the bottom corners.
   Single dark arcade look on purpose: flag red + black, lekë gold, felt-cap white. */
:root{
  --ink:#140f12;
  --panel:#1f171b;
  --paper:#f6f0e4;
  --muted:#c2b6ba;
  --flag:#d7263d;
  --flag-deep:#8e1b2a;
  --gold:#f5c542;
  --gold-deep:#8a6a12;
  --font-display:"Press Start 2P", ui-monospace, Menlo, monospace;
  --font-body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#game{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:crisp-edges;image-rendering:pixelated;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px));
  pointer-events:none;font-family:var(--font-display);font-size:11px;line-height:1;text-shadow:2px 2px 0 #000}
.chip{display:flex;align-items:center;gap:6px;background:rgba(20,15,18,.6);padding:6px 8px;border-radius:2px;white-space:nowrap}
.chip.done{background:rgba(58,166,85,.75)}
.chip.alarm{background:var(--flag);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:var(--flag-deep)}}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold-deep);color:#5c4300;font-size:7px;line-height:12px;text-align:center;text-shadow:none}
.plis{width:12px;height:8px;border-radius:6px 6px 1px 1px;background:var(--paper);box-shadow:inset 0 -2px 0 #bdb5a6}
#hud .spacer{flex:1}
.hbtn{pointer-events:auto;font:inherit;color:var(--paper);text-shadow:inherit;background:rgba(20,15,18,.6);border:2px solid rgba(246,240,228,.4);border-radius:3px;min-width:40px;height:34px;padding:0 8px;cursor:pointer}
.hbtn.off{opacity:.55;text-decoration:line-through}
.hbtn:focus-visible,.btn:focus-visible,.lvb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:620px){#hLevel{display:none}}

/* Touch pads */
#pad{position:absolute;inset:0;z-index:3;display:none}
#pad.show{display:block}
.tb{position:absolute;width:76px;height:76px;border-radius:50%;border:3px solid rgba(246,240,228,.45);background:rgba(20,15,18,.3);
  color:rgba(246,240,228,.9);display:grid;place-items:center;align-content:center;gap:2px;font-family:var(--font-display);font-size:18px;pointer-events:none}
.tb small{font-family:var(--font-body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tb svg{width:26px;height:26px;fill:currentColor}
.tb.on{background:rgba(215,38,61,.6);border-color:var(--paper)}
#tL{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(104px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tB{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tA{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:84px;height:84px}

/* Toast */
#toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--panel);border:2px solid var(--paper);box-shadow:3px 3px 0 #000;
  padding:8px 12px;font-family:var(--font-display);font-size:10px;line-height:1.5;text-align:center;max-width:min(90vw,460px);pointer-events:none}

/* Screens */
#screen{position:absolute;inset:0;z-index:8;display:grid;place-items:center;overflow:auto;background:rgba(12,8,10,.5);
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  padding-inline:calc(16px + env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:3px solid var(--paper);box-shadow:6px 6px 0 #000;padding:18px 20px;width:100%;max-width:600px;display:grid;gap:12px;text-align:center}
.title{max-width:720px;grid-template-columns:1fr;align-items:center}
@media (min-width:640px){.title{grid-template-columns:1fr 1.15fr;text-align:left}.title .brand{justify-items:start}}
.brand{display:grid;justify-items:center;gap:8px}
.flagbox{background:var(--flag);border:3px solid #000;padding:6px 10px;box-shadow:3px 3px 0 #000;line-height:0}
.flagbox canvas{width:66px;height:60px;image-rendering:pixelated}
.logo{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,9vw,66px);letter-spacing:.04em;color:var(--flag);text-shadow:4px 4px 0 #000;line-height:1}
.tag{margin:0;font-size:17px;color:var(--paper)}
.tag span{color:var(--muted)}
.side{display:grid;gap:10px;min-width:0}
.lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lvb{font-family:var(--font-body);font-size:15px;text-align:left;color:var(--paper);background:#2b2126;border:2px solid #5a4a50;border-radius:2px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.lvb b{font-family:var(--font-display);font-size:10px;font-weight:400;color:var(--gold);letter-spacing:.04em}
.lvb[disabled]{opacity:.45;cursor:not-allowed}
.lvb:not([disabled]):hover{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.title .row{justify-content:flex-start}
.btn{font-family:var(--font-display);font-size:12px;line-height:1.4;color:var(--ink);background:var(--gold);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px 14px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--flag);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.help{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.help b{color:var(--paper);font-weight:600}
.eyebrow{margin:0;font-family:var(--font-display);font-size:10px;letter-spacing:.12em;color:var(--gold)}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(18px,4vw,26px);line-height:1.3;color:var(--paper);text-wrap:balance}
.en{margin:-4px 0 0;font-size:17px;color:var(--muted)}
.mission{border:2px dashed var(--gold);padding:10px 12px;font-size:18px;line-height:1.35}
.mission b{display:block;font-family:var(--font-display);font-weight:400;font-size:9px;letter-spacing:.14em;color:var(--gold);margin-bottom:6px}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--font-display);font-size:11px;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:6px}
.hint{margin:0;font-size:13px;color:var(--muted)}

/* Rotate prompt */
#rotate{position:absolute;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;text-align:center;padding:24px}
#rotate .card{max-width:340px}
.phone{width:44px;height:74px;border:4px solid var(--paper);border-radius:8px;margin:0 auto;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone,.chip.alarm{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="game" width="320" height="192" aria-label="Orik game screen"></canvas>
  <div id="pad" aria-hidden="true">
    <div class="tb" id="tL"><svg viewBox="0 0 20 20"><path d="M14 3 5 10l9 7z"/></svg></div>
    <div class="tb" id="tR"><svg viewBox="0 0 20 20"><path d="M6 3l9 7-9 7z"/></svg></div>
    <div class="tb" id="tB"><span>B</span><small>run · olive</small></div>
    <div class="tb" id="tA"><span>A</span><small>jump</small></div>
  </div>
  <div id="hud" hidden>
    <div class="chip"><span class="coin">L</span><b id="hLeke">0</b></div>
    <div class="chip"><span class="plis"></span><b id="hLives">×3</b></div>
    <div class="chip" id="hMission"></div>
    <div class="spacer"></div>
    <div class="chip" id="hLevel"></div>
    <button class="hbtn" id="bMute" type="button" aria-label="Sound on or off">♪</button>
    <button class="hbtn" id="bPause" type="button" aria-label="Pause">II</button>
  </div>
  <div id="toast" hidden></div>
  <div id="screen" hidden></div>
  <div id="rotate" hidden>
    <div class="card">
      <div class="phone"></div>
      <h2>Rotate your phone</h2>
      <p class="hint">Orik runs sideways. Turn the phone to landscape.</p>
      <div class="row"><button class="btn ghost" id="bFsR" type="button">Try fullscreen</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const TILE = 16, ROWS = 12, VH = ROWS * TILE;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let VW = 320;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------------- save ---------------- */
const SAVE_KEY = 'orik-save-v1';
let save = { unlocked: 1, muted: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- sprites ---------------- */
const PAL = { K:'#1a1418', W:'#f4f1e8', R:'#d7263d', r:'#8e1b2a', S:'#f0b58a', s:'#c9855a', O:'#6b3e26',
  Y:'#f5c542', y:'#b8860b', G:'#3aa655', g:'#1f6b35', P:'#5b3a8c', p:'#3a2560', L:'#55661f', l:'#8a9a3a',
  T:'#e3a857', t:'#a0612b', D:'#2e7d4f', d:'#163d27', B:'#8fcf6a', F:'#ff8c1a', f:'#ffd23f', H:'#8b5a3c', h:'#5e3a24', E:'#d9d4c8' };
function mk(rows, pal) {
  pal = pal || PAL;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;

}
function flipC(c) { const f = document.createElement('canvas'); f.width = c.width; f.height = c.height; const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }
const both = c => [c, flipC(c)];
const dbl = rows => { const o = []; rows.forEach(r => { o.push(r, r); }); return o; };

// Orik: white plis (felt cap), black moustache, red vest over white shirt
const OH = ['.....WWWWW......','....WWWWWWW.....','....KKSSSSS.....','....KSSSKSS.....','....KSSSSSSs....','.....SKKKKS.....','......SSSS......'];
const OT = ['....RRWWWRR.....','...RRRWWWRRR....','..SRRRWWWRRRS...','..SSRRWWWRRSS...'];
const OTJ = ['..S.RRWWWRR.S...','..SRRRWWWRRRS...','...RRRWWWRRR....','....RRWWWRR.....'];
const LS = ['....KKKKKKK.....','....KKK.KKK.....','....KKK.KKK.....','...OOO...OOO....','..OOOO...OOOO...'];
const LW1 = ['....KKKKKKK.....','...KKK...KKK....','..KKK.....KK....','.OOO......OOO...','.OO........OO...'];
const LW2 = ['....KKKKKKK.....','.....KKKKK......','.....KK.KK......','....OOO.OOO.....','....OO..OO......'];
function orikSet(pal) {
  return {
    small: { stand: both(mk([...OH, ...OT, ...LS], pal)), w1: both(mk([...OH, ...OT, ...LW1], pal)), w2: both(mk([...OH, ...OT, ...LW2], pal)), jump: both(mk([...OH, ...OTJ, ...LW1], pal)) },

  };
}
const ORIK = orikSet(PAL);
const ORIK_OLIVE = orikSet(Object.assign({}, PAL, { R: '#6f8f2a', r: '#3f5a17' }));

const COIN = mk(['....YYYYY....','..YYYYYYYYY..','.YYyyyyyyyYY.','.YyYYYYYYYyY.','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyyyyYYYyY','.YyYYYYYYYyY.','.YYyyyyyyyYY.','..YYYYYYYYY..','....YYYYY....']);
const BEETLE_TOP = ['.....KKKKKK.....','...KKPPPPPPKK...','..KPPpPPPPpPPK..','..KPPPpPPpPPPK..','.KPPPPPppPPPPPK.','.KPPPPPppPPPPPK.','.KKKKKKKKKKKKKK.','..KWK......KWK..','..KKK......KKK..'];
const BEETLE = [mk([...BEETLE_TOP, '..K..K....K..K..', '.K....K..K....K.']), mk([...BEETLE_TOP, '...K.K....K.K...', '...K..K..K..K...'])];
const BEETLE_FLAT = mk(['..KKKKKKKKKKKK..','.KPPPpPPPPpPPPK.','.KKKKKKKKKKKKKK.']);

const HOG = [both(mk([...HOG_TOP, '..K.K.....K.K...', '..K.K.....K.K...'])), both(mk([...HOG_TOP, '...K.K...K.K....', '...K.K...K.K....']))];
const CROW = [
  both(mk(['..KK............','..KKK...........','...KKK......KK..','....KKKKKKKKKWK.','....KKKKKKKKKKYY','.....KKKKKKKK...','......KK........'])),
  both(mk(['................','................','............KK..','....KKKKKKKKKWK.','....KKKKKKKKKKYY','...KKKKKKKKKK...','..KKK...........','.KK.............']))
];
const LAMB = both(mk(['......WWWWW.....','...WWWWWWWWWW...','..WWWWWWWWWWKKK.','..WWWWWWWWWWKWK.','..WWWWWWWWWWKKK.','...WWWWWWWWWW...','...K.K...K.K....','...K.K...K.K....']));
const KEY = mk(['.YYYY.........','YY..YY........','Y....YYYYYYYYY','YY..YY....Y.Y.','.YYYY.........']);
const BYREK = mk(['....tttttttt....','..ttTTTTTTTTtt..','.tTTTttttttTTTt.','.tTTtTTTTTTtTTt.','.tTTtTttttTtTTt.','.tTTtTTTTTTtTTt.','.tTTTttttttTTTt.','..ttTTTTTTTTtt..','....tttttttt....']);
const OLIVE = mk(['........gG....','.......gGG....','......gG......','....KKKKKK....','...KLLLLLLK...','..KLLLLLWLLK..','..KLLLLLLWLK..','..KLLLLLLLLLK.','..KLLLLLLLLLK.','...KLLLLLLLLK.','....KLLLLLLK..','.....KKKKKK...']);
const SHOT = mk(['.KKKK.','KLLLLK','KLlLLK','KLLLLK','KLLLLK','.KKKK.']);
const FIRE = [mk(['..fFF...','.fFFFF..','fFFfFFF.','FFffFFFF','FFffFFFF','fFFfFFF.','.fFFFF..','..fFF...']), mk(['...FFf..','..FFFFf.','.FFFfFFf','FFFFffFF','FFFFffFF','.FFFfFFf','..FFFFf.','...FFf..'])];
const EAGLE_HALF = ['.....KK....','....KKKK...','...KKKKK...','..KK.KKK...','......KKK..','K......KKK.','KK......KKK','KKK....KKKK','.KKK..KKKKK','K.KKKKKKKKK','KK.KKKKKKKK','.KK.KKKKKKK','..KK.KKKKKK','...KK.KKKKK','....K.KKKKK','......KKKKK','.......KKKK','......K.KKK','.....K..K.K','........K..'];
const EAGLE = mk(EAGLE_HALF.map(r => r + r.split('').reverse().join('')));
const KUCEDRA = both(mk([
  '..................dd......dd....',
  '.................dDDd....dDDd...',
  '................dDDYDd..dDDYDd..',
  '...............dDDDDDDddDDDDDDd.',
  '...............dDDDDDRRdDDDDDRR.',
  '................dDDDd...dDDDd...',
  '.................dDDd...dDDd....',
  '..................dDDd.dDDd.....',

  '....dd.........dddddDDDDd.......',
  '...dDDd.....ddDDDDDDDDDd........',
  '..dDd.....dDDDDDDDDDDDDDd.......',
  '..dDd...ddDDDDBBBBBDDDDDd.......',
  '...dDdddDDDDBBBBBBBBDDDDd.......',
  '....dDDDDDDBBBBBBBBBBDDDd.......',
  '.....dDDDDDBBBBBBBBBBDDd........',
  '......ddDDDDBBBBBBBBDDDd........',
  '........dDDDDDDDDDDDDDd.........',
  '.........dDDd....dDDd...........',
  '........dDDd......dDDd..........',

/* ---------------- themes & tiles ---------------- */
const T = { E:0, GROUND:1, BRICK:2, QCOIN:3, QPOW:4, USED:5, STONE:6, BUNKER:7, GATE:8, MULTI:9 };
const THEMES = {
  beach:  { sky:['#5fbdf2','#d8f1ff'], ground:'#e3c374', groundTop:'#f7e2a6', groundDark:'#b99543', brick:'#c7663f', brickLine:'#6e341f', stone:'#b8a58a', stoneLight:'#e0d0b6', stoneDark:'#7d6b52', music:0 },
  berat:  { sky:['#f08a4b','#fde2c0'], ground:'#8f8373', groundTop:'#6aa84f', groundDark:'#62584b', brick:'#b35c3b', brickLine:'#5e2e1c', stone:'#a39a8e', stoneLight:'#cfc6b8', stoneDark:'#6b6358', music:1 },

};
function makeTiles(th) {
  const mkc = () => { const c = document.createElement('canvas'); c.width = 16; c.height = 16; return [c, c.getContext('2d')]; };
  const o = {};
  let [c, x] = mkc();
  x.fillStyle = th.ground; x.fillRect(0, 0, 16, 16); x.fillStyle = th.groundDark;
  [[2,3],[9,6],[5,11],[13,13],[12,2],[3,8],[8,14]].forEach(([a, b]) => x.fillRect(a, b, 2, 1));
  o.ground = c;

  [c, x] = mkc(); x.fillStyle = th.brick; x.fillRect(0, 0, 16, 16); x.fillStyle = th.brickLine;
  x.fillRect(0, 0, 16, 1); x.fillRect(0, 7, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(7, 0, 1, 7); x.fillRect(3, 8, 1, 7); x.fillRect(11, 8, 1, 7);
  x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, 1, 7, 1); x.fillRect(8, 1, 8, 1); x.fillRect(4, 8, 7, 1); o.brick = c;
  [c, x] = mkc(); x.fillStyle = '#1a1418'; x.fillRect(0, 0, 16, 16); x.fillStyle = '#f5c542'; x.fillRect(1, 1, 14, 14);
  x.fillStyle = '#ffe28a'; x.fillRect(1, 1, 14, 1); x.fillRect(1, 1, 1, 14); x.fillStyle = '#b8860b'; x.fillRect(1, 14, 14, 1); x.fillRect(14, 1, 1, 14);
  x.fillStyle = '#d7263d'; [[7,3,2,1],[6,4,4,1],[5,5,6,1],[4,6,8,1],[3,7,10,2],[4,9,8,1],[5,10,6,1],[6,11,4,1],[7,12,2,1]].forEach(r => x.fillRect(...r));
  x.fillStyle = '#1a1418'; x.fillRect(7, 6, 2, 4); x.fillRect(6, 7, 4, 2); o.q = c;

    e(type, x, row = 9) { L.spawns.push({ type, x: x * 16, yb: (row + 1) * 16 }); return b; },
    lamb(x, row = 9) { L.lambs.push({ x: x * 16 + 1, y: (row + 1) * 16 - 8, w: 14, h: 8, got: false }); return b; },
    key(x, row) { L.keys.push({ x: x * 16 + 1, y: row * 16 + 5, w: 14, h: 6, got: false }); return b; },
    cp(x) { L.cps.push({ x: x * 16, on: false }); return b; },

/* ---------------- sizing ---------------- */

}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));

let last = 0, accum = 0;
function loop(ts) {

  while (accum >= 1 / 60 && n < 5) { tick(); accum -= 1 / 60; n++; }

window.claude?.hot?.snapshot?.(() => ({ unlocked: save.unlocked }));

})();
